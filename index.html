<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infirma — interactive prototype</title>

<style>
html,body{margin:0;height:100%;background:#EEF2F6;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{width:394px;height:852px;flex:none;transform-origin:center center;border-radius:40px;box-shadow:0 30px 80px rgba(16,24,40,.18)}
#app{width:394px;height:852px;position:relative;overflow:hidden;border-radius:40px;background:#F7F9FB}

html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
@keyframes scrEnter{from{opacity:0}to{opacity:1}}
.scr-enter{animation:scrEnter .28s ease both}
@keyframes auraA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,10px) scale(1.08)}}
@keyframes auraB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-14px,14px) scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes drawerIn{from{transform:translateX(-100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes arcIn{from{stroke-dashoffset:170}to{stroke-dashoffset:0}}
@keyframes dotsIn{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ifmPop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes ifmFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes calIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6px,-6px) scale(1.04)}}
@keyframes auraC{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(10px,-12px) scale(1.1)}}
@keyframes wigA{0%,100%{transform:translate(0,0)}25%{transform:translate(1.6px,-1.2px)}50%{transform:translate(-.8px,-2px)}75%{transform:translate(-1.6px,.8px)}}
@keyframes wigB{0%,100%{transform:translate(0,0)}30%{transform:translate(-1.4px,1.4px)}60%{transform:translate(1.2px,1.8px)}80%{transform:translate(1.8px,-.6px)}}
@keyframes dotInA{from{opacity:0;transform:translateY(10px) scale(.6)}to{opacity:1;transform:none}}
@keyframes dotInB{from{opacity:0;transform:translateY(10px) scale(.6)}to{opacity:1;transform:none}}
@keyframes numInA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes numInB{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:1}}
@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{r:9;opacity:.35}50%{r:13;opacity:.12}}
@keyframes drop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.4);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-24}}
.scr-home a{color:#101828}
.scr-home a:hover{color:#364153}
.scr-home .hm,.scr-home .hm *{scrollbar-width:none}
.scr-home .hm *::-webkit-scrollbar{display:none;width:0;height:0}
.scr-home .hm button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scr-home .hm button:focus-visible,.scr-home .hm a:focus-visible,.scr-home .hm input:focus-visible{outline:2px solid #101828;outline-offset:2px}
.scr-home .scroller>*{flex-shrink:0}
.scr-home .emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.scr-home .glass{background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 12px 32px rgba(61,107,149,.10);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.scr-home .a1{animation:auraA 9s ease-in-out infinite}
.scr-home .a2{animation:auraB 11s ease-in-out infinite}
.scr-home .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.scr-home .arcdraw{stroke-dasharray:170;animation:arcIn 1.2s cubic-bezier(.3,.7,.2,1) .2s both}
.scr-home .dotsin{animation:dotsIn .8s ease 1s both}
.scr-home .pillbob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scr-home .pop{animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.scr-home .a1,.scr-home .a2,.scr-home .rise,.scr-home .pop,.scr-home .arcdraw,.scr-home .dotsin,.scr-home .pillbob{animation:none !important}}
.scr-log a{color:#101828}
.scr-log a:hover{color:#364153}
.scr-log .ifm,.scr-log .ifm *{scrollbar-width:none;-ms-overflow-style:none}
.scr-log .ifm::-webkit-scrollbar,.scr-log .ifm *::-webkit-scrollbar{display:none;width:0;height:0}
.scr-log .ifm button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scr-log .ifm button:focus-visible,.scr-log .ifm input:focus-visible,.scr-log .ifm textarea:focus-visible{outline:2px solid #101828;outline-offset:2px}
.scr-log .ifm input::placeholder{color:#6A7282;opacity:1}
.scr-log .ifm .ifm-search::placeholder{color:#364153}
.scr-log .ifm textarea::placeholder{color:#6A7282}
.scr-log .ifm-pop{animation:ifmPop .36s cubic-bezier(.2,.8,.2,1) both}
.scr-log .ifm-screen{animation:ifmFade .45s cubic-bezier(.2,.8,.2,1) both}
.scr-calendar a{color:#101828}
.scr-calendar a:hover{color:#364153}
.scr-calendar .cal,.scr-calendar .cal *{scrollbar-width:none}
.scr-calendar .cal *::-webkit-scrollbar{display:none;width:0;height:0}
.scr-calendar .cal button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scr-calendar .cal button:focus-visible{outline:2px solid #101828;outline-offset:2px}
.scr-calendar .emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.scr-calendar .cal-in{animation:calIn .45s cubic-bezier(.2,.8,.2,1) both}
.scr-calendar .orb{animation:orbFloat 7s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.scr-calendar .orb,.scr-calendar .cal-in{animation:none}}
.scr-insights a{color:#101828}
.scr-insights a:hover{color:#364153}
.scr-insights .ins,.scr-insights .ins *{scrollbar-width:none}
.scr-insights .ins *::-webkit-scrollbar{display:none;width:0;height:0}
.scr-insights .ins button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scr-insights .ins button:focus-visible{outline:2px solid #101828;outline-offset:2px}
.scr-insights .scroller>*{flex-shrink:0}
.scr-insights .emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.scr-insights .glass{background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 12px 32px rgba(61,107,149,.10);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.scr-insights .a1{animation:auraA 9s ease-in-out infinite}
.scr-insights .a2{animation:auraB 11s ease-in-out infinite}
.scr-insights .a3{animation:auraC 8s ease-in-out infinite}
.scr-insights .breathe{animation:breathe 5s ease-in-out infinite}
.scr-insights .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.scr-insights .draw{stroke-dasharray:600;animation:draw 1.2s cubic-bezier(.3,.7,.2,1) both}
.scr-insights .pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.scr-insights .a1,.scr-insights .a2,.scr-insights .a3,.scr-insights .dot-in,.scr-insights .dot-w,.scr-insights .num-in,.scr-insights .breathe,.scr-insights .rise,.scr-insights .draw,.scr-insights .pulse{animation:none !important}}
.scr-care a{color:#101828}
.scr-care a:hover{color:#364153}
.scr-care .cr,.scr-care .cr *{scrollbar-width:none}
.scr-care .cr *::-webkit-scrollbar{display:none;width:0;height:0}
.scr-care .cr button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scr-care .cr button:focus-visible,.scr-care .cr a:focus-visible,.scr-care .cr input:focus-visible{outline:2px solid #101828;outline-offset:2px}
.scr-care .emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.scr-care .glass{background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 10px 28px rgba(16,24,40,.12);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}
.scr-care .chip{border:0;height:32px;padding:0 13px;border-radius:999px;font-size:13px;color:#101828;transition:background .2s,color .2s,box-shadow .2s}
.scr-care .drop{animation:drop .28s cubic-bezier(.2,.85,.25,1) both;transform-origin:top center}
.scr-care .ping{animation:ping 1.8s ease-out infinite}
.scr-care .dash{animation:dash 1s linear infinite}
@media (prefers-reduced-motion: reduce){.scr-care .drop,.scr-care .ping,.scr-care .dash{animation:none !important}}
.scr-articles a{color:#101828}
.scr-articles a:hover{color:#364153}
.scr-articles .ar,.scr-articles .ar *{scrollbar-width:none}
.scr-articles .ar *::-webkit-scrollbar{display:none;width:0;height:0}
.scr-articles .ar button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scr-articles .ar button:focus-visible,.scr-articles .ar a:focus-visible,.scr-articles .ar input:focus-visible{outline:2px solid #101828;outline-offset:2px}
.scr-articles .scroller>*{flex-shrink:0}
.scr-articles .emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.scr-articles .glass{background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 12px 32px rgba(61,107,149,.10);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.scr-articles .a1{animation:auraA 9s ease-in-out infinite}
.scr-articles .a2{animation:auraB 11s ease-in-out infinite}
.scr-articles .rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.scr-articles .pop{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.scr-articles .a1,.scr-articles .a2,.scr-articles .rise,.scr-articles .pop{animation:none !important}}
</style>

<div style="position: absolute; left: 16px; right: 16px; bottom: 20px; display: flex; gap: 10px; align-items: center">
<nav aria-label="Main" class="glass" style="flex: 1; display: flex; justify-content: space-between; padding: 6px; border-radius: 999px; background: rgba(255,255,255,.72)">
<a href="#" @click=${V.__nav.home} style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 12px rgba(16,24,40,.08); text-decoration: none; color: #8A6A12; font-size: 10.5px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 9l7-6 7 6v8H3z"></path></svg>Home</a>
<a href="#" @click=${V.__nav.insights} style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: #4A5565; font-size: 10.5px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14l5-5 3 3 7-7M13 5h4v4"></path></svg>Insights</a>
<a href="#" @click=${V.__nav.calendar} style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: #4A5565; font-size: 10.5px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="14" height="13" rx="3"></rect><path d="M3 8h14M7 2.5v3M13 2.5v3"></path></svg>Calendar</a>
<a href="#" @click=${V.__nav.care} style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: #4A5565; font-size: 10.5px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 5l4-2 6 2 4-2v12l-4 2-6-2-4 2z M7 3v12M13 5v12"></path></svg>Care</a>
</nav>
<a href="#" @click=${V.__nav.log} aria-label="Log a symptom, medication or event" style="flex: none; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(140deg, #F2D58A 0%, #C9A24C 100%); color: #FFFFFF; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(201,162,76,.35), inset 0 1px 0 rgba(255,255,255,.5)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M11 4v14M4 11h14"></path></svg>
</a>
</div>

${(V.articles.reading) ? html`
<div style="position: absolute; inset: 0; z-index: 10">
<button type="button" aria-label="Close article" @click=${V.articles.close} style="position: absolute; inset: 0; border: 0; background: rgba(16,24,40,.35); animation: fade .25s both"></button>
<div role="dialog" aria-label="${V.articles.r.title}" style="position: absolute; left: 14px; right: 14px; top: 62px; bottom: 0; border-radius: 34px 34px 0 0; overflow: hidden; background: #FFFFFF; box-shadow: 0 -10px 40px rgba(16,24,40,.2); animation: sheetUp .45s cubic-bezier(.2,.85,.25,1) both; display: flex; flex-direction: column">
<div style="position: relative; flex: none; height: 74px; overflow: hidden; background: linear-gradient(120deg, #DCEAF6 0%, #EAF2F8 55%, #F6E7C1 130%)">
<span aria-hidden="true" class="a2" style="position: absolute; right: -40px; top: -60px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(246,225,166,.8), rgba(246,225,166,0) 70%)"></span>
<button type="button" aria-label="Close" @click=${V.articles.close} style="position: absolute; left: 18px; top: 16px; width: 42px; height: 42px; border: 0; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 12px rgba(16,24,40,.12); display: grid; place-items: center; color: #101828"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"></path></svg></button>
<button type="button" aria-pressed="${V.articles.r.saved}" @click=${V.articles.r.toggleSave} style="position: absolute; right: 18px; top: 18px; height: 38px; padding: 0 14px; border: 0; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; transition: background .25s, color .25s; ${V.articles.r.saveBtn}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="${V.articles.r.saveFill}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 2.5h8v11L8 10.8 4 13.5z"></path></svg>${V.articles.r.saveLabel}</button>
</div>
<div style="flex: 1; overflow-y: auto; padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 6px; align-items: center"><span class="emo" aria-hidden="true" style="width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; ${V.articles.r.iconBg}">${V.articles.r.e}</span><span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; ${V.articles.r.tagStyle}">${V.articles.r.tag}</span><span style="font-size: 12.5px; color: #6A7282">${V.articles.r.mins} min read</span></div>
<h2 style="margin: 0; font-size: 27px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em">${V.articles.r.title}</h2>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; padding-bottom: 14px; border-bottom: 1px solid #EEF1F4"><span style="font-weight: 600; color: #2F5B85">${V.articles.r.src}</span><span aria-hidden="true" style="width: 4px; height: 4px; border-radius: 50%; background: #A0A7B3"></span><span style="color: #6A7282">${V.articles.r.date}</span></div>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #364153; font-weight: 500">${V.articles.r.sum}</p>
${((V.articles.r.body) || []).map((L_para) => html`<p style="margin: 0; font-size: 15.5px; line-height: 1.65; color: #364153">${L_para}</p>`)}
<div style="margin-top: 8px; border-radius: 18px; padding: 14px; background: #F7F9FB; font-size: 12.5px; line-height: 1.5; color: #4A5565">For education only, not medical advice. Talk to a healthcare professional about your own care.</div>
${(V.articles.r.hasNext) ? html`
<button type="button" @click=${V.articles.r.next} style="border: 0; border-radius: 20px; padding: 14px 16px; text-align: left; display: flex; align-items: center; gap: 12px; background: linear-gradient(120deg, #EAF2F8, #F6EBCB); color: #101828">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #6A7282">Up next</span><span style="font-size: 15px; font-weight: 600">${V.articles.r.nextTitle}</span></span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l4 4-4 4"></path></svg>
</button>
` : nothing}
</div>
</div>
</div>
` : nothing}

</div></div>`;

const host = {
  state: { screen: "home" },
  queued: false,
  bump() { if (this.queued) return; this.queued = true; queueMicrotask(() => { this.queued = false; this.draw(); }); },
  go(k) { this.state.screen = k; const el = document.querySelector(".scr-" + k); this.draw(); },
  draw() {
    const V = hostVals(this, this.state.screen);
    const scr = this.state.screen;
    render(html`${scr === "home" ? T.home(V) : nothing}${scr === "calendar" ? T.calendar(V) : nothing}${scr === "insights" ? T.insights(V) : nothing}${scr === "care" ? T.care(V) : nothing}${scr === "articles" ? T.articles(V) : nothing}${T.log(V)}`, document.getElementById("app"));
  }
};
hostInit(host);
host.draw();

function fit() {
  const pad = 24, s = Math.min(1, (innerHeight - pad) / 852, (innerWidth - pad) / 394);
  document.getElementById("stage").style.transform = "scale(" + s + ")";
}
addEventListener("resize", fit); fit();
</script>
</body>
</html>
